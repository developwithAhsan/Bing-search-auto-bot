        }

        .frame-wrap::-webkit-scrollbar { width: 6px; }
        .frame-wrap::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="window-dots">
                <div class="dot dot-red" title="Close"></div>
                <div class="dot dot-yellow" title="Minimize"></div>
                <div class="dot dot-green" title="Maximize"></div>
            </div>
            <button class="menu-toggle" id="menuToggle" title="Menu">
                <i class="fas fa-bars"></i>
            </button>
            <input type="text" class="address-bar" placeholder="Search keywords or enter URL" id="addressBar">
            <div class="header-actions">
                <button class="icon-btn" id="backBtn" title="Back"><i class="fas fa-arrow-left"></i></button>
                <button class="icon-btn" id="forwardBtn" title="Forward"><i class="fas fa-arrow-right"></i></button>
                <button class="icon-btn" id="refreshBtn" title="Refresh"><i class="fas fa-redo"></i></button>
            </div>
        </header>

        <div class="main-layout">
            <div class="sidebar-overlay" id="sidebarOverlay"></div>

            <aside class="sidebar" id="sidebar">
                <div class="sidebar-content">
                    <div class="panel animate-fade-up delay-100">
                        <div class="panel-header">
                            <div class="panel-icon" id="botIcon"><i class="fas fa-robot"></i></div>
                            <div class="panel-title">AI SEO Bot</div>
                        </div>
                        <div class="btn-row">
                            <button class="btn btn-primary" id="startBot">
                                <i class="fas fa-play"></i> Start
                            </button>
                            <button class="btn btn-danger" id="stopBot" disabled>
                                <i class="fas fa-stop"></i> Stop
                            </button>
                        </div>
                        <div class="progress-wrap">
                            <div class="progress-meta">
                                <span class="progress-label">Progress</span>
                                <span class="progress-value"><span id="wordCount">0</span> / 500</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                        </div>
                        <div class="status-row">
                            <div class="status-dot" id="statusDot"></div>
                            <div class="status-text">Status: <span id="botStatus">Idle</span></div>
                        </div>
                    </div>

                    <div class="panel animate-fade-up delay-200">
                        <div class="panel-header">
                            <div class="panel-icon" style="background: linear-gradient(135deg, var(--warning), #f97316);">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div class="panel-title">Search Interval</div>
                        </div>
                        <div class="time-grid">
                            <div class="time-field">
                                <div class="time-label">Minutes</div>
                                <input type="number" class="time-input" id="minutesInput" min="0" max="59" value="1">
                            </div>
                            <div class="time-field">
                                <div class="time-label">Seconds</div>
                                <input type="number" class="time-input" id="secondsInput" min="0" max="59" value="23">
                            </div>
                        </div>
                        <button class="btn btn-ghost" id="setTimeBtn" style="width: 100%;">
                            <i class="fas fa-check"></i> Apply Interval
                        </button>
                        <div style="text-align: center;">
                            <div class="interval-badge">
                                <i class="fas fa-hourglass-half"></i>
                                Current: <span id="currentInterval">1m 23s</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-footer animate-fade-up delay-300">
                    <div class="footer-title">
                        <i class="fas fa-file-alt" style="font-size: 10px;"></i> Pages
                    </div>
                    <nav class="footer-links">
                        <a href="index.html" class="footer-link">
                            <i class="fas fa-home"></i> Home
                        </a>
                        <a href="disclaimer.html" class="footer-link">
                            <i class="fas fa-shield-alt"></i> Disclaimer
                        </a>
                        <a href="privacy.html" class="footer-link">
                            <i class="fas fa-user-lock"></i> Privacy Policy
                        </a>
                        <a href="terms.html" class="footer-link">
                            <i class="fas fa-file-contract"></i> Terms of Service
                        </a>
                    </nav>
                </div>
            </aside>

            <main class="content-area">
                <div class="search-strip">
                    <input type="text" class="search-input" placeholder="Enter keywords for SEO research..." id="searchInput">
                    <button class="search-btn" id="searchBtn" title="Search">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="frame-wrap">
                    <iframe class="bing-frame" id="bingFrame"
                            src="https://www.bing.com/search?q=bing+points+collector+bot&PC=U316&FORM=CHROMN"
                            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation"
                            title="Search results"></iframe>
                </div>
            </main>
        </div>
    </div>

    <script>
        let botActive = false;
        let botInterval;
        let keywordCount = 0;
        let researchKeywords = [];
        let customInterval = 8000;

        const trendingKeywords = [
            'gta vice city online', 'Zohaib noob', 'gta vice city online play', 'deep learning applications',
            'SEO optimization techniques', 'content marketing strategy', 'social media marketing', 'email marketing automation',
            'e-commerce platform comparison', 'Monetag', 'dropshipping strategies', 'sales funnel optimization',
            'web development frameworks', 'gta vice city free play', 'cloud computing services', 'developwithahsan',
            'cryptocurrency investment', 'stock market analysis', 'personal finance management', 'online learning platforms',
            'bing reward bot', 'NFT marketplace', 'metaverse trends', 'duckybhai', 'bing auto pts collector',
            'digital marketing ROI', 'Google Analytics 4', 'WordPress plugins', 'React vs Vue', 'hug deya',
            'data visualization tools', 'Thor top movies', 'Ishowspeed', 'lead generation tactics'
        ];

        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const startBot = document.getElementById('startBot');
        const stopBot = document.getElementById('stopBot');
        const progressFill = document.getElementById('progressFill');
        const wordCount = document.getElementById('wordCount');
        const botStatus = document.getElementById('botStatus');
        const statusDot = document.getElementById('statusDot');
        const botIcon = document.getElementById('botIcon');
        const bingFrame = document.getElementById('bingFrame');
        const addressBar = document.getElementById('addressBar');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            loadSettings();
        });

        function setupEventListeners() {
            menuToggle.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch(searchInput.value.trim());
            });
            searchBtn.addEventListener('click', () => performSearch(searchInput.value.trim()));

            addressBar.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const val = addressBar.value.trim();
                    if (val.includes('http') || val.includes('www.') || val.includes('.')) {
                        navigateToURL(val);
                    } else {
                        performSearch(val);
                    }
                }
            });

            startBot.addEventListener('click', startBotAction);
            stopBot.addEventListener('click', stopBotAction);
            document.getElementById('setTimeBtn').addEventListener('click', setCustomInterval);

            document.getElementById('backBtn').addEventListener('click', () => {
                try { bingFrame.contentWindow.history.back(); } catch(e){}
            });
            document.getElementById('forwardBtn').addEventListener('click', () => {
                try { bingFrame.contentWindow.history.forward(); } catch(e){}
            });
            document.getElementById('refreshBtn').addEventListener('click', () => {
                bingFrame.src = bingFrame.src;
            });
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('open');
        }

        function performSearch(query) {
            if (!query) return;
            const url = `https://www.bing.com/search?q=${encodeURIComponent(query)}&form=QBLH&setmkt=en-US&cc=US`;
            bingFrame.src = url;
            addressBar.value = url;
            if (window.innerWidth <= 768) closeSidebar();
        }

        function navigateToURL(url) {
            const fullUrl = url.startsWith('http') ? url : `https://${url}`;
            bingFrame.src = fullUrl;
            addressBar.value = fullUrl;
        }

        function setCustomInterval() {
            const mins = parseInt(document.getElementById('minutesInput').value) || 0;
            const secs = parseInt(document.getElementById('secondsInput').value) || 0;
            if (mins < 0 || secs < 0 || secs > 59) return;

            customInterval = (mins * 60 + secs) * 1000;
            updateIntervalDisplay();
            localStorage.setItem('customInterval', customInterval);

            if (botActive) {
                clearInterval(botInterval);
                botInterval = setInterval(performAutomatedResearch, customInterval);
            }
        }

        function updateIntervalDisplay() {
            const mins = parseInt(document.getElementById('minutesInput').value) || 0;
            const secs = parseInt(document.getElementById('secondsInput').value) || 0;
            document.getElementById('currentInterval').textContent = `${mins}m ${secs}s`;
        }

        function startBotAction() {
            if (botActive) return;
            botActive = true;

            startBot.disabled = true;
            stopBot.disabled = false;
            statusDot.classList.add('running');
            botIcon.classList.add('pulse');
            progressFill.classList.add('active');

            updateBotStatus('Running...');
            performAutomatedResearch();
            botInterval = setInterval(performAutomatedResearch, customInterval);
        }

        function stopBotAction() {
            if (!botActive) return;
            botActive = false;

            startBot.disabled = false;
            stopBot.disabled = true;
            statusDot.classList.remove('running');
            botIcon.classList.remove('pulse');
            progressFill.classList.remove('active');

            updateBotStatus('Idle');
            if (botInterval) { clearInterval(botInterval); botInterval = null; }
        }

        function performAutomatedResearch() {
            if (keywordCount >= 500) {
                stopBotAction();
                updateBotStatus('Completed 500/500');
                return;
            }
            const available = trendingKeywords.filter(k => !researchKeywords.includes(k));
            const pool = available.length > 0 ? available : trendingKeywords;
            const keyword = pool[Math.floor(Math.random() * pool.length)];

            researchKeywords.push(keyword);
            performSearch(keyword);

            keywordCount++;
            updateProgress();
            updateBotStatus(`Searching: ${keyword.substring(0, 22)}...`);
        }

        function updateProgress() {
            const pct = (keywordCount / 500) * 100;
            progressFill.style.width = `${pct}%`;
            wordCount.textContent = keywordCount;
        }

        function updateBotStatus(text) {
            botStatus.textContent = text;
        }

        function loadSettings() {
            const saved = localStorage.getItem('customInterval');
            if (saved) {
                customInterval = parseInt(saved);
                const mins = Math.floor(customInterval / 60000);
                const secs = Math.floor((customInterval % 60000) / 1000);
                document.getElementById('minutesInput').value = mins;
                document.getElementById('secondsInput').value = secs;
                updateIntervalDisplay();
            }
        }
    </script>
</body>
</html>
